name: Checkpoint Info on PR

on:
  pull_request:
    types: [opened, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  post-checkpoint-info:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get latest checkpoint info
        id: checkpoint
        run: |
          if [ -f checkpoints/LATEST.md ]; then
            # Extract checkpoint ID
            CHECKPOINT_ID=$(grep "Checkpoint ID:" checkpoints/LATEST.md | head -1 | sed 's/\*\*Checkpoint ID:\*\* //' || echo "unknown")

            # Extract checkpoint description (from title)
            DESCRIPTION=$(grep "^# Checkpoint:" checkpoints/LATEST.md | head -1 | sed 's/^# Checkpoint: //' || echo "Unknown")

            # Extract phase
            PHASE=$(grep "^\*\*Phase:\*\*" checkpoints/LATEST.md | head -1 | sed 's/\*\*Phase:\*\* //' || echo "unknown")

            # Extract date
            DATE=$(grep "^\*\*Date:\*\*" checkpoints/LATEST.md | head -1 | sed 's/\*\*Date:\*\* //' || echo "unknown")

            # Extract 30-second summary (first paragraph after the header)
            SUMMARY=$(sed -n '/## 30-Second Summary/,/^---/p' checkpoints/LATEST.md | grep -v "^#" | grep -v "^---" | grep -v "^$" | head -5 | sed 's/^/> /')

            # Extract critical files
            CRITICAL_FILES=$(sed -n '/\*\*Critical (Read immediately):\*\*/,/\*\*Important/p' checkpoints/LATEST.md | grep "^[0-9]" | head -5 | sed 's/^/- /')

            echo "exists=true" >> $GITHUB_OUTPUT
            echo "checkpoint_id=$CHECKPOINT_ID" >> $GITHUB_OUTPUT
            echo "description=$DESCRIPTION" >> $GITHUB_OUTPUT
            echo "phase=$PHASE" >> $GITHUB_OUTPUT
            echo "date=$DATE" >> $GITHUB_OUTPUT

            # Multi-line output
            {
              echo 'summary<<EOF'
              echo "$SUMMARY"
              echo EOF
            } >> $GITHUB_OUTPUT

            {
              echo 'critical_files<<EOF'
              echo "$CRITICAL_FILES"
              echo EOF
            } >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Comment on PR
        if: steps.checkpoint.outputs.exists == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## 📍 Latest Checkpoint Available

            Welcome! There's a checkpoint available to help you resume context quickly.

            **Checkpoint:** ${{ steps.checkpoint.outputs.description }}
            **Phase:** ${{ steps.checkpoint.outputs.phase }}
            **Created:** ${{ steps.checkpoint.outputs.date }}

            ### Quick Summary
            ${{ steps.checkpoint.outputs.summary }}

            ### Critical Files to Review
            ${{ steps.checkpoint.outputs.critical_files }}

            ---

            **To resume from this checkpoint:**
            \`\`\`bash
            ./tools/resume-from-checkpoint.sh
            \`\`\`

            Or read the checkpoint directly: \`checkpoints/LATEST.md\`

            This automated message helps AI agents and contributors quickly restore project context.
            `
            })
