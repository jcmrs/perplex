name: Auto-merge Claude Branches

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    name: Auto-merge Claude branches after validation
    runs-on: ubuntu-latest
    # Only auto-merge PRs from claude/* branches
    if: startsWith(github.head_ref, 'claude/')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Detect agent from branch name
        id: detect-agent
        run: |
          BRANCH_NAME="${{ github.head_ref }}"
          echo "Branch: $BRANCH_NAME"

          if [[ "$BRANCH_NAME" =~ ^claude/design- ]]; then
            AGENT_NAME="CDIR"
            AGENT_FULL_NAME="CLI-Director"
            CAN_AUTO_MERGE="true"
            echo "Agent: CDIR (Designer-Researcher)"
          elif [[ "$BRANCH_NAME" =~ ^claude/impl- ]]; then
            AGENT_NAME="CEXE"
            AGENT_FULL_NAME="CLI-Executor"
            CAN_AUTO_MERGE="true"
            echo "Agent: CEXE (Executor-Validator)"
          elif [[ "$BRANCH_NAME" =~ ^claude/web-emergency- ]]; then
            AGENT_NAME="Web"
            AGENT_FULL_NAME="Web Emergency"
            CAN_AUTO_MERGE="false"
            echo "Agent: Web (Emergency Standby - REQUIRES MANUAL APPROVAL)"
          else
            AGENT_NAME="Claude"
            AGENT_FULL_NAME="Claude Agent"
            CAN_AUTO_MERGE="true"
            echo "Agent: Unknown pattern (allowing auto-merge)"
          fi

          echo "agent_name=$AGENT_NAME" >> $GITHUB_OUTPUT
          echo "agent_full_name=$AGENT_FULL_NAME" >> $GITHUB_OUTPUT
          echo "can_auto_merge=$CAN_AUTO_MERGE" >> $GITHUB_OUTPUT

      - name: Check Web emergency branch (requires manual approval)
        if: steps.detect-agent.outputs.can_auto_merge == 'false'
        run: |
          echo "⚠️  Web emergency branch detected"
          echo "Merge rule: Requires manual approval (emergency only)"
          echo ""
          echo "Web agent should only be active when:"
          echo "  - CDIR unavailable for >24 hours"
          echo "  - Critical emergency requiring immediate action"
          echo ""
          echo "This PR will NOT be auto-merged."
          echo "Human review and manual merge required."
          exit 1

      - name: Run foundation validation
        id: validation
        run: |
          chmod +x tools/validate-foundation.sh
          if ./tools/validate-foundation.sh; then
            echo "validation=passed" >> $GITHUB_OUTPUT
          else
            echo "validation=failed" >> $GITHUB_OUTPUT
            exit 1
          fi

      - name: Auto-merge PR
        if: steps.validation.outputs.validation == 'passed'
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;

            const agentName = '${{ steps.detect-agent.outputs.agent_name }}';
            const agentFullName = '${{ steps.detect-agent.outputs.agent_full_name }}';

            // Add comment explaining auto-merge
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
              body: `## ✅ Auto-merge Initiated

              **Agent:** ${agentFullName} (${agentName})
              **Branch:** \`${pr.head.ref}\`

              This PR has passed all validation checks:
              - Agent detection: ✅ ${agentName}
              - Foundation validation: ✅ Passed
              - All required checks: ✅ Passed

              Merging automatically per three-agent AI-First workflow policy.

              Workflow: \`.github/workflows/auto-merge-claude-branches.yml\`
              `
            });

            // Merge the PR
            try {
              await github.rest.pulls.merge({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: pr.number,
                merge_method: 'merge',
                commit_title: `Merge ${pr.title}`,
                commit_message: `Auto-merged by Claude Code workflow after validation passed.`
              });

              console.log('PR merged successfully');

              // Delete the branch after merge
              try {
                await github.rest.git.deleteRef({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  ref: `heads/${pr.head.ref}`
                });
                console.log('Branch deleted successfully');
              } catch (deleteError) {
                console.log('Branch deletion failed (may already be deleted):', deleteError.message);
              }

            } catch (mergeError) {
              console.error('Merge failed:', mergeError.message);

              // Comment on failure
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                body: `## ⚠️ Auto-merge Failed

                Validation passed but merge failed. This may be due to:
                - Merge conflicts
                - Branch protection rules
                - Other GitHub restrictions

                Error: ${mergeError.message}

                **Manual intervention required.**`
              });

              throw mergeError;
            }
