name: Scheduled Completeness Check

on:
  schedule:
    # Run every Monday at 9am UTC
    - cron: '0 9 * * 1'
  workflow_dispatch:  # Allow manual trigger

jobs:
  completeness-check:
    name: Weekly Health Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Need full history for analysis

      - name: Run completeness review
        id: completeness
        continue-on-error: true
        run: |
          # Run in non-interactive mode
          export COMPLETENESS_NON_INTERACTIVE=true

          # Capture output and exit code
          set +e
          OUTPUT=$(./tools/review-completeness.sh 2>&1)
          EXIT_CODE=$?
          set -e

          # Save output for later
          echo "$OUTPUT" > /tmp/completeness-output.txt

          # Set outputs
          echo "exit_code=$EXIT_CODE" >> $GITHUB_OUTPUT

          # Extract summary counts (warnings, issues)
          WARNINGS=$(echo "$OUTPUT" | grep -c "⚠" || echo "0")
          ISSUES=$(echo "$OUTPUT" | grep -c "✗" || echo "0")

          echo "warnings=$WARNINGS" >> $GITHUB_OUTPUT
          echo "issues=$ISSUES" >> $GITHUB_OUTPUT

          # Show output in logs
          echo "$OUTPUT"

      - name: Create issue if problems found
        if: steps.completeness.outputs.exit_code != '0'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const output = fs.readFileSync('/tmp/completeness-output.txt', 'utf8');
            const exitCode = '${{ steps.completeness.outputs.exit_code }}';
            const warnings = '${{ steps.completeness.outputs.warnings }}';
            const issues = '${{ steps.completeness.outputs.issues }}';

            const issueTitle = `Scheduled Completeness Check Failed (${new Date().toISOString().split('T')[0]})`;

            const issueBody = `## Automated Completeness Health Check

            **Status:** ❌ Failed
            **Date:** ${new Date().toISOString()}
            **Branch:** ${context.ref}
            **Commit:** ${context.sha}

            ### Summary

            - **Warnings:** ${warnings}
            - **Issues:** ${issues}
            - **Exit Code:** ${exitCode}

            ### Details

            \`\`\`
            ${output}
            \`\`\`

            ### Next Steps

            1. Review the completeness output above
            2. Address any critical issues (marked with ✗)
            3. Consider addressing warnings (marked with ⚠)
            4. Run \`./tools/review-completeness.sh\` locally for interactive mode
            5. Close this issue once problems are resolved

            ### Notes

            This is an automated health check that runs weekly. It helps catch:
            - Uncommitted changes lingering in branches
            - Outdated documentation
            - Missing artifacts (ADRs, session logs, checkpoints)
            - Stale work in progress

            See \`docs/COMPLETENESS_REVIEW.md\` for more information.

            ---

            **Automated by:** Scheduled Completeness Check workflow
            **Workflow:** [\`scheduled-completeness.yml\`](.github/workflows/scheduled-completeness.yml)
            **Configuration:** [\`config/completeness.yml\`](config/completeness.yml)
            `;

            // Create the issue
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: issueTitle,
              body: issueBody,
              labels: ['automated', 'completeness-check', 'health']
            });

      - name: Comment on success
        if: steps.completeness.outputs.exit_code == '0'
        run: |
          echo "✅ Completeness check passed! Repository is healthy."
          echo ""
          echo "Warnings: ${{ steps.completeness.outputs.warnings }}"
          echo "Issues: ${{ steps.completeness.outputs.issues }}"

      - name: Upload completeness report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: completeness-report-${{ github.run_id }}
          path: /tmp/completeness-output.txt
          retention-days: 30
